name: Apply cinema logo sizing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update logo sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.logo{width:76px;height:76px}', '.logo{width:110px;height:110px}')
          s=s.replace('@media(max-width:560px){.logo{width:64px;height:64px}', '@media(max-width:560px){.logo{width:82px;height:82px}')
          s=s.replace('assets/varadharaja-logo.svg', 'assets/varadharaja-logo.svg')
          p.write_text(s)
          PY
      - name: Commit sizing change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase Varadharaja logo size"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-logo-sizing.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time logo workflow"
          git push