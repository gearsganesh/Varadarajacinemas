name: Update Cinema Showtimes

on:
  push:
    branches: [main]
    paths:
      - 'site-v2.html'
      - 'scripts/update-showtimes.mjs'
      - '.github/workflows/update-showtimes.yml'
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: varadaraja-showtime-updater
  cancel-in-progress: true

jobs:
  update-showtimes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update showtimes and 8-hour Now Showing posters
        run: node scripts/update-showtimes.mjs

      - name: Commit updated data
        run: |
          git config user.name "Varadaraja Cinema Bot"
          git config user.email "actions@users.noreply.github.com"

          git add showtimes.json assets/posters

          if git diff --cached --quiet; then
            echo "No showtime or poster changes."
          else
            git commit -m "Update cinema showtimes and posters"
            git pull --rebase origin main
            git push
          fi
