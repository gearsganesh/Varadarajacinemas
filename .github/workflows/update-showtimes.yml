name: Update TicketNew Showtimes and Posters

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-showtimes.mjs'
      - '.github/workflows/update-showtimes.yml'

permissions:
  contents: write

concurrency:
  group: ticketnew-cinema-refresh
  cancel-in-progress: true

jobs:
  update-cinema-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh TicketNew data and movie posters
        run: node scripts/update-showtimes.mjs

      - name: Commit refreshed data and posters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showtimes.json assets/posters/
          git diff --cached --quiet || git commit -m 'Refresh cinema showtimes and posters'
          git push
