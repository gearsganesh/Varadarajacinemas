<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varadharaja Cinemas</title>
<link rel="icon" type="image/svg+xml" href="assets/varadharaja-logo.svg">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707}.site{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe class="site" src="site-v2.html" title="Varadharaja Cinemas" onload="initSite(this)"></iframe>
<script>
const MAP_LAT='12.937873',MAP_LNG='80.138946';
function initSite(frame){
  try{
    const doc=frame.contentDocument;if(!doc)return;
    const style=doc.createElement('style');
    style.textContent=`
      html,body{background:transparent!important;overflow-x:hidden!important}
      body{isolation:isolate}
      .nav{z-index:30!important;flex-wrap:nowrap!important}
      .nav .logo{flex:0 0 auto!important}
      .map{padding:0!important;overflow:hidden!important;min-height:320px!important}
      .map iframe{display:block;width:100%;height:100%;min-height:320px;border:0}
      @media(max-width:760px){
        .nav{height:74px!important;padding:0 12px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;flex-wrap:nowrap!important}
        .nav>a{flex:1 1 auto!important;min-width:0!important;display:flex!important;align-items:center!important;overflow:hidden!important}
        .nav .logo{width:180px!important;height:40px!important;max-width:180px!important;max-height:40px!important;object-fit:contain!important;object-position:left center!important}
        .links{display:none!important}
        .nav>div:last-child{display:flex!important;flex:0 0 auto!important;width:auto!important;min-width:0!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important;margin:0!important;padding:0!important}
        .book{display:inline-flex!important;box-sizing:border-box!important;flex:0 0 108px!important;width:108px!important;min-width:108px!important;max-width:108px!important;height:44px!important;padding:0!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-size:12px!important;line-height:1!important;white-space:nowrap!important;word-break:keep-all!important;overflow:hidden!important}
        .mobile{display:inline-flex!important;box-sizing:border-box!important;flex:0 0 34px!important;width:34px!important;min-width:34px!important;height:34px!important;padding:0!important;align-items:center!important;justify-content:center!important;font-size:27px!important;line-height:1!important}
      }
      @media(max-width:380px){
        .nav{padding:0 9px!important;gap:5px!important}
        .nav .logo{width:158px!important;max-width:158px!important;max-height:36px!important}
        .nav>div:last-child{gap:5px!important}
        .book{flex-basis:101px!important;width:101px!important;min-width:101px!important;max-width:101px!important;font-size:11px!important}
      }
    `;
    doc.head.appendChild(style);
    const map=doc.querySelector('#contact .map');
    if(map)map.innerHTML='<iframe src="https://www.google.com/maps?q='+MAP_LAT+','+MAP_LNG+'&z=17&output=embed" title="Varadharaja Cinemas location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>';
  }catch(e){console.error(e)}
}
</script>
</body>
</html>
