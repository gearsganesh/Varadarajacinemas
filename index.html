<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varadharaja Cinemas</title>
<link rel="icon" type="image/svg+xml" href="assets/varadharaja-logo.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707}
.site{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe class="site" src="site-v2.html" title="Varadharaja Cinemas" onload="initSite(this)"></iframe>
<script>
const TICKETNEW='https://ticketnew.com/movies/chennai/varadaraja-cinemas-4k-rgb-laser-dolby-atmos-chennai-c/1037507';
const MAP_LAT='12.937873',MAP_LNG='80.138946',REFRESH_MS=10*60*1000;

function initSite(frame){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;

    const style=doc.createElement('style');
    style.textContent=`
      html,body{background:transparent!important;overflow-x:hidden!important}
      body{isolation:isolate}
      body>nav,body>header,body>section,body>footer{position:relative;z-index:10}
      .nav{z-index:30!important}
      .nav .logo{flex:0 0 auto!important}
      .hero{background:transparent!important}
      .section{background:transparent!important}
      .stats,.card,.review,.feature,.address{background-color:rgba(16,16,16,.72)!important;backdrop-filter:blur(7px)}
      .feature{background:linear-gradient(135deg,rgba(33,16,21,.72),rgba(12,12,12,.68))!important}
      .feature.gold{background:linear-gradient(135deg,rgba(61,42,18,.72),rgba(13,13,13,.68))!important}
      .movie .poster{position:relative;overflow:hidden;background-size:cover!important;background-position:center!important}
      .movie .poster.has-image:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.03) 70%)}
      .movie .poster .poster-label{position:relative;z-index:2}
      .showtimes .time{cursor:pointer;position:relative}
      .showtimes .time.is-live{border-color:#b84d42!important;color:#fff!important}
      .showtimes .time.is-next{border-color:#d6a84f!important}
      .live-status,.next-status,.movie-status{display:inline-block;margin-left:7px;font-size:9px;font-weight:700;letter-spacing:.8px}
      .live-status,.movie-status.live{color:#e66a5d}.next-status,.movie-status.next{color:#d6a84f}
      .map{padding:0!important;overflow:hidden!important;min-height:320px!important}
      .map iframe{display:block;width:100%;height:100%;min-height:320px;border:0}
      .movie-book{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:9px 13px;border:1px solid #d6a84f;background:#d6a84f;color:#080808;border-radius:3px;font-size:11px;font-weight:700;cursor:pointer}
      @media(max-width:760px){
        .nav{height:74px!important;padding:0 12px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;flex-wrap:nowrap!important}
        .nav>a{flex:1 1 auto!important;min-width:0!important;display:flex!important;align-items:center!important;overflow:hidden!important}
        .nav .logo{width:180px!important;height:40px!important;max-width:180px!important;max-height:40px!important;object-fit:contain!important;object-position:left center!important}
        .links{display:none!important}
        .nav>div:last-child{display:flex!important;flex:0 0 auto!important;width:auto!important;min-width:0!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important;margin:0!important;padding:0!important}
        .book{display:inline-flex!important;box-sizing:border-box!important;flex:0 0 108px!important;width:108px!important;min-width:108px!important;max-width:108px!important;height:44px!important;padding:0!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-size:12px!important;line-height:1!important;white-space:nowrap!important;word-break:keep-all!important;overflow:hidden!important}
        .mobile{display:inline-flex!important;box-sizing:border-box!important;flex:0 0 34px!important;width:34px!important;min-width:34px!important;height:34px!important;padding:0!important;align-items:center!important;justify-content:center!important;font-size:27px!important;line-height:1!important}
        .hero{padding-top:120px!important}
        .card,.feature,.review,.address{backdrop-filter:blur(5px)!important}
      }
      @media(max-width:380px){
        .nav{padding:0 9px!important;gap:5px!important}
        .nav .logo{width:158px!important;max-width:158px!important;max-height:36px!important}
        .nav>div:last-child{gap:5px!important}
        .book{flex-basis:101px!important;width:101px!important;min-width:101px!important;max-width:101px!important;font-size:11px!important}
      }
    `;
    doc.head.appendChild(style);

    const logo=doc.querySelector('.nav .logo');
    if(logo){logo.src='assets/varadharaja-header-logo.png';logo.alt='Varadharaja Cinemas'}

    const bg=doc.createElement('script');
    bg.type='module';
    bg.src='assets/global-cinematic-wave.js?v=3';
    doc.body.appendChild(bg);

    loadMap(doc);
    loadShowtimes(doc);
  }catch(e){console.error(e)}
}

function loadMap(doc){
  const map=doc.querySelector('#contact .map');
  if(map)map.innerHTML='<iframe src="https://www.google.com/maps?q='+MAP_LAT+','+MAP_LNG+'&z=17&output=embed" title="Varadharaja Cinemas location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>';
}

function parseTime(s){
  const m=String(s).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);if(!m)return null;
  let h=+m[1],n=+m[2];if(m[3].toUpperCase()==='PM'&&h<12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0;return h*60+n;
}
function nowMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function statuses(movies){
  const now=nowMinutes(),all=[];
  for(const movie of movies)for(const st of movie.showtimes||[]){const t=parseTime(st.time);if(t!=null)all.push({movie,st,t})}
  const live=new Set(),liveMovies=new Set();
  for(const x of all){const elapsed=(now-x.t+1440)%1440;if(elapsed<=150){live.add(x.movie.title+'|'+x.movie.language+'|'+x.st.time);liveMovies.add(x.movie.title+'|'+x.movie.language)}}
  let next=null,delta=Infinity;
  for(const x of all){let d=x.t-now;if(d<0)d+=1440;if(d>.5&&d<delta){delta=d;next=x}}
  return{live,liveMovies,next:next?next.movie.title+'|'+next.movie.language+'|'+next.st.time:null}
}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

async function loadShowtimes(doc){
  const grid=doc.querySelector('#movies .grid4');if(!grid)return;
  try{
    const r=await fetch('/api/showtimes?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);
    const data=await r.json(),movies=data.movies||[];if(!movies.length)throw Error('No cached movies');
    const s=statuses(movies);grid.innerHTML='';
    movies.forEach(movie=>{
      const card=doc.createElement('article');card.className='card movie';
      const key=movie.title+'|'+movie.language+'|';
      const poster=doc.createElement('div');poster.className='poster';
      if(movie.poster){poster.style.backgroundImage='url("'+String(movie.poster).replace(/"/g,'')+'")';poster.classList.add('has-image')}
      poster.innerHTML='<span class="poster-label">'+esc(movie.title).replace(/: /g,':<br>')+'</span>';
      const info=doc.createElement('div');info.className='movie-info';
      const meta=doc.createElement('small');meta.textContent=(movie.language||'')+' • '+(movie.rating||'')+' • '+(movie.format||'2D');
      if(movie.showtimes.some(st=>s.liveMovies.has(movie.title+'|'+movie.language))){const b=doc.createElement('span');b.className='movie-status live';b.textContent='SHOWING NOW';meta.appendChild(b)}
      else if(movie.showtimes.some(st=>s.next===key+st.time)){const b=doc.createElement('span');b.className='movie-status next';b.textContent='NEXT SHOW';meta.appendChild(b)}
      const h=doc.createElement('h3');h.textContent=movie.title;
      const shows=doc.createElement('div');shows.className='showtimes';
      for(const st of movie.showtimes||[]){
        const b=doc.createElement('button');b.className='time';const k=key+st.time;
        b.textContent=st.time+(st.audi?' · '+st.audi:'');
        if(s.live.has(k))b.classList.add('is-live');else if(s.next===k)b.classList.add('is-next');
        b.onclick=()=>window.open(movie.bookingUrl||TICKETNEW,'_blank','noopener');shows.appendChild(b);
      }
      const book=doc.createElement('button');book.className='movie-book';book.textContent='BOOK NOW';book.onclick=()=>window.open(movie.bookingUrl||TICKETNEW,'_blank','noopener');
      info.append(meta,h,shows,book);card.append(poster,info);grid.appendChild(card);
    });
    const sub=doc.querySelector('#movies .sub');
    if(sub)sub.innerHTML='Live schedule • Updated '+new Date(data.fetchedAt||Date.now()).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' <a style="margin-left:10px;color:#d6a84f" href="'+TICKETNEW+'" target="_blank" rel="noopener">BOOK ON TICKETNEW →</a>';
  }catch(e){
    console.error('Live showtimes:',e);
    const sub=doc.querySelector('#movies .sub');if(sub)sub.innerHTML='Live schedule is being refreshed. <a style="margin-left:10px;color:#d6a84f" href="'+TICKETNEW+'" target="_blank" rel="noopener">VIEW TICKETNEW →</a>';
  }
  setTimeout(()=>loadShowtimes(doc),REFRESH_MS);
}
</script>
</body>
</html>
