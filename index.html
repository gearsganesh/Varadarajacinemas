function brandHeader(frame){try{const doc=frame.contentDocument,logo=doc.querySelector('.nav .logo');if(logo){logo.src='assets/varadharaja-header-logo.png';logo.alt='Varadharaja Cinemas';logo.style.width='270px';logo.style.height='54px';logo.style.objectFit='contain';logo.style.objectPosition='left center'}const fav=doc.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=FAVICON;doc.head.appendChild(fav);const style=doc.createElement('style');style.textContent=`@media(max-width:760px){.nav{height:78px!important;padding:0 18px!important}.nav .logo{width:185px!important;height:40px!important}.nav>div:last-child{display:flex!important;align-items:center!important;gap:8px!important;flex:0 0 auto!important}.book{padding:10px 12px!important;font-size:12px!important;white-space:nowrap!important}.mobile{display:block!important;padding:0!important;margin:0!important;font-size:30px!important;line-height:1!important;width:34px!important;height:40px!important}.links{display:none!important}}.nav{padding-left:4%!important}.nav .logo{flex:0 0 auto}.movie .poster{position:relative;overflow:hidden;background-size:cover!important;background-position:center!important}.movie .poster.has-image:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.04) 68%)}.movie .poster .poster-label{position:relative;z-index:2;display:block}.showtimes .time{cursor:pointer}.showtime-source{display:inline-block;margin-left:10px;color:#d6a84f}.map{padding:0!important;overflow:hidden!important;min-height:320px!important}.map iframe{display:block;width:100%;height:100%;min-height:320px;border:0;filter:saturate(.85) contrast(1.05)}`;doc.head.appendChild(style);loadMap(doc);loadLiveShowtimes(doc)}catch(e){console.error(e)}}
function loadMap(doc){const map=doc.querySelector('#contact .map');if(!map)return;map.innerHTML=`<iframe src="https://www.google.com/maps?q=${MAP_LAT},${MAP_LNG}&z=17&output=embed" title="Varadharaja Cinemas location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`}
async function loadLiveShowtimes(doc){const grid=doc.querySelector('#movies .grid4');if(!grid)return;try{const res=await fetch('showtimes.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error(res.status);const data=await res.json();if(!Array.isArray(data.movies)||!data.movies.length)throw Error('No movie data');const groups=new Map();for(const movie of data.movies){const key=movie.title+'|'+movie.language+'|'+(movie.format||'2D');if(!groups.has(key))groups.set(key,{...movie,showtimes:[...(movie.showtimes||[])]});else groups.get(key).showtimes.push(...(movie.showtimes||[]))}grid.innerHTML='';[...groups.values()].forEach((movie,index)=>{const article=doc.createElement('article');article.className='card movie';const poster=doc.createElement('div');poster.className='poster';poster.style.background=['linear-gradient(145deg,#35151d,#17100c,#050505)','linear-gradient(145deg,#172735,#5b3b22,#070707)','linear-gradient(145deg,#29291d,#542b20,#070707)','linear-gradient(145deg,#1a1930,#51406b,#070707)'][index%4];if(movie.poster){poster.style.backgroundImage=`url("${movie.poster}")`;poster.classList.add('has-image')}poster.innerHTML='<span class="poster-label">'+escapeHtml(movie.title).replace(/: /g,':<br>')+'</span>';const info=doc.createElement('div');info.className='movie-info';const meta=doc.createElement('small');meta.textContent=(movie.language||'')+' • '+(movie.rating||'')+' • '+(movie.format||'2D');const h3=doc.createElement('h3');h3.textContent=movie.title;const show=doc.createElement('div');show.className='showtimes';for(const st of movie.showtimes){const btn=doc.createElement('button');btn.className='time';btn.textContent=st.time+(st.audi?' · '+st.audi:'');btn.onclick=()=>window.open(TICKETNEW,'_blank','noopener');show.appendChild(btn)}info.append(meta,h3,show);article.append(poster,info);grid.appendChild(article)});const subtitle=doc.querySelector('#movies .sub');if(subtitle)subtitle.innerHTML='<a class="showtime-source" href="'+TICKETNEW+'" target="_blank" rel="noopener">BOOK ON TICKETNEW →</a>'}catch(err){console.error('Live showtimes load failed',err);const subtitle=doc.querySelector('#movies .sub');if(subtitle)subtitle.innerHTML='<a class="showtime-source" href="'+TICKETNEW+'" target="_blank" rel="noopener">VIEW TICKETNEW →</a>'}}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
