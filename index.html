<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varadharaja Cinemas</title>
<link rel="icon" type="image/svg+xml" href="assets/varadharaja-logo.svg">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707}.site{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe class="site" src="site-v2.html" title="Varadharaja Cinemas" onload="brandHeader(this)"></iframe>
<script>
function brandHeader(frame){
try{
const doc=frame.contentDocument;
const style=doc.createElement('style');
style.textContent=`
.nav{flex-wrap:nowrap!important}.nav .logo{flex:0 0 auto!important}
@media(max-width:760px){
.nav{height:74px!important;padding:0 12px!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;flex-wrap:nowrap!important;gap:8px!important}
.nav>a{flex:1 1 auto!important;min-width:0!important;width:auto!important;display:flex!important;align-items:center!important;overflow:hidden!important}
.nav .logo{width:min(48vw,180px)!important;height:auto!important;max-height:40px!important;object-fit:contain!important;object-position:left center!important;flex:0 1 auto!important}
.links{display:none!important}
.nav>div:last-child{display:flex!important;flex:0 0 auto!important;width:auto!important;min-width:0!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important;margin:0!important;white-space:nowrap!important}
.book{box-sizing:border-box!important;display:inline-flex!important;flex:0 0 108px!important;width:108px!important;min-width:108px!important;max-width:108px!important;height:44px!important;padding:0 6px!important;margin:0!important;align-items:center!important;justify-content:center!important;text-align:center!important;white-space:nowrap!important;word-break:keep-all!important;overflow:hidden!important;font-size:12px!important;line-height:1!important}
.mobile{display:inline-flex!important;flex:0 0 34px!important;width:34px!important;min-width:34px!important;max-width:34px!important;height:34px!important;padding:0!important;margin:0!important;align-items:center!important;justify-content:center!important;font-size:27px!important;line-height:1!important}
.hero{padding-top:120px!important}
}
@media(max-width:380px){.nav{padding:0 9px!important;gap:5px!important}.nav .logo{width:min(45vw,158px)!important;max-height:36px!important}.nav>div:last-child{gap:5px!important}.book{flex-basis:101px!important;width:101px!important;min-width:101px!important;max-width:101px!important;font-size:11px!important}}
`;
doc.head.appendChild(style);
const logo=doc.querySelector('.nav .logo');
if(logo){logo.src='assets/varadharaja-header-logo.png';logo.alt='Varadharaja Cinemas';logo.style.objectFit='contain';logo.style.objectPosition='left center'}
}catch(e){console.error(e)}
}
</script>
</body>
</html>
