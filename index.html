<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varadharaja Cinemas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707}
.site{position:fixed;inset:0;width:100%;height:100%;border:0}
.logo-overlay{position:fixed;z-index:100;top:10px;left:4.5%;width:110px;height:110px;object-fit:contain;border-radius:50%;pointer-events:none;filter:drop-shadow(0 5px 18px #000)}
@media(max-width:900px){.logo-overlay{width:92px;height:92px;top:8px;left:4%}}
@media(max-width:560px){.logo-overlay{width:82px;height:82px;top:6px;left:4%}}
</style>
</head>
<body>
<iframe class="site" src="site.html" title="Varadharaja Cinemas"></iframe>
<img class="logo-overlay" src="assets/varadharaja-logo-header.webp" alt="Varadharaja Cinemas">
</body>
</html>
